name: DIAG secret-vs-var
on: [workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Report resolution of secret vs variable
        env:
          S: ${{ secrets.SN_INSTANCE_DOMAIN }}
          V: ${{ vars.SN_INSTANCE_DOMAIN }}
          SU: ${{ secrets.SN_USERNAME }}
        run: |
          echo "secrets.SN_INSTANCE_DOMAIN length = ${#S}"
          echo "vars.SN_INSTANCE_DOMAIN  length = ${#V}"
          echo "vars value (not secret)  = $V"
          echo "secrets.SN_USERNAME length = ${#SU}"
          if [ "$S" = "$V" ]; then echo "MATCH: secret and variable are the same value"; else echo "MISMATCH: secret != variable"; fi
          if [ -z "$S" ]; then echo "SECRET_EMPTY=true"; else echo "SECRET_EMPTY=false"; fi
